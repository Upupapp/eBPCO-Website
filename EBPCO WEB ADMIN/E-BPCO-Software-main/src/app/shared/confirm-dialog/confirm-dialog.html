<div class="modal-backdrop" [class.closing]="closing()" (click)="requestCancel()">
  <div class="modal-box" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true">
    <button type="button" class="modal-close" aria-label="Close" (click)="requestCancel()">&#10005;</button>
    <h2>{{ title() }}</h2>
    @if (message()) {
      <p>{{ message() }}</p>
    }
    <div class="modal-actions">
      <button type="button" class="modal-btn neutral" (click)="requestCancel()">{{ cancelLabel() }}</button>
      <button
        type="button"
        class="modal-btn"
        [class.danger]="tone() === 'danger'"
        [class.confirm]="tone() !== 'danger'"
        (click)="requestConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
