<div class="agency-header">
  <img class="agency-seal" [src]="config().sealAssetPath" alt="" aria-hidden="true" />
  <div class="agency-lines">
    <span>{{ config().line1 }}</span>
    <span>{{ config().line2 }}</span>
    @if (config().line3) {
      <strong>{{ config().line3 }}</strong>
    }
    <span class="agency-office">{{ config().officeLine }}</span>
  </div>
</div>
