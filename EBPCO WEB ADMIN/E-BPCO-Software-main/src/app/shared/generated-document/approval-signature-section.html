<section class="doc-generated-section approval-signature">
  <h2>Approval</h2>
  <div class="signature-block">
    @if (signatory()?.signatureImagePath; as img) {
      <img class="signature-image" [src]="img" alt="Authorized signature" />
    } @else {
      <div class="signature-pending">Pending Authorized Signature</div>
    }
    <div class="signature-line"></div>
    <div class="signature-name">{{ display(approvingOfficial(), pending) }}</div>
    <div class="signature-position">{{ display(signatory()?.position || approvingOffice(), pending) }}</div>
  </div>
</section>
