<section class="doc-generated-section">
  <h2>{{ title() }}</h2>
  @if (rows().length > 0) {
    <table class="doc-generated-table">
      <thead>
        <tr>
          @for (col of columns(); track col.key) {
            <th>{{ col.label }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (col of columns(); track col.key) {
              <td>{{ cell(row, col.key) }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="doc-generated-note doc-generated-placeholder">No entries recorded yet for this schedule.</p>
  }
</section>
