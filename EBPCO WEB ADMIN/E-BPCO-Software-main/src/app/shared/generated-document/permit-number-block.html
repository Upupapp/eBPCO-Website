<div class="permit-number-block">
  <div class="permit-number-main">
    <span class="permit-number-label">Permit No.</span>
    <span class="permit-number-value" [class.doc-generated-placeholder]="!permitNumber()">
      {{ permitNumber() ?? notAssigned }}
    </span>
  </div>
  <div class="permit-number-dates">
    <span>Date Issued: <strong>{{ display(issuedDate(), notAssigned) }}</strong></span>
    <span>Valid Until: <strong>{{ display(expiryDate(), 'No fixed expiry') }}</strong></span>
  </div>
</div>
