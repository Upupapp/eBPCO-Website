<section class="qr-block">
  @if (modules(); as m) {
    <svg class="qr-svg" [attr.viewBox]="'0 0 ' + m.count + ' ' + m.count" shape-rendering="crispEdges">
      <rect width="100%" height="100%" fill="#ffffff" />
      @for (cell of m.cells; track cellKey(cell)) {
        <rect [attr.x]="cell.x" [attr.y]="cell.y" width="1" height="1" fill="#000000" />
      }
    </svg>
    <p class="qr-caption">Scan to verify this document at<br />{{ verificationUrl() }}</p>
  } @else {
    <p class="qr-caption qr-unavailable">QR verification not yet available for this document — issue the permit first.</p>
  }
</section>
