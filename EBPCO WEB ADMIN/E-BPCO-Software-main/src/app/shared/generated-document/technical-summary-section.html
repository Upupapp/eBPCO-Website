@if (rendered().length > 0) {
  <section class="doc-generated-section">
    <h2>Technical Summary</h2>
    <dl class="doc-generated-fields">
      @for (f of rendered(); track f.label) {
        <div>
          <dt>{{ f.label }}</dt>
          <dd [class.doc-generated-placeholder]="!f.filled">{{ f.display }}</dd>
        </div>
      }
    </dl>
  </section>
}
