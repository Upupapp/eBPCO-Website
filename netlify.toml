# Build config for the Municipality of Castilla LGU information portal.
#
# The Angular app is NOT at the repository root — the root holds only
# castilla-lgu-portal/, docs/ and assets/, with no package.json and no
# index.html. Without `base` below, Netlify builds at the root, finds nothing
# to build, publishes an empty directory, and every path returns its default
# 404 page.
[build]
  base    = "castilla-lgu-portal"
  command = "npm run build"
  # Angular emits browser assets into dist/<project>/browser; angular.json sets
  # no explicit outputPath, so this tracks the project name in package.json.
  publish = "dist/castilla-lgu-portal/browser"

[build.environment]
  # Angular 22 and npm 11 both require a current Node. Pin it rather than
  # inheriting whatever the build image currently defaults to.
  NODE_VERSION = "22"

# There is deliberately NO catch-all rewrite here.
#
# Every route is prerendered to a real HTML file at build time — all 46 of
# them, the office and permit detail pages included — so Netlify serves each
# address from disk and the client router takes over from there. Nothing needs
# rewriting to /index.html.
#
# Removing that rewrite is what makes the status codes honest. It previously
# answered EVERY unmatched path with the app shell at 200: a mistyped address
# looked like a working page, a missing form PDF downloaded as an HTML file
# named .pdf, and three consecutive failed deploys went unnoticed for two days
# because nothing on the site could return an error. Now an address with no
# file behind it gets 404.html — the prerendered not-found page — with a real
# 404 status, and a missing asset simply 404s.
#
# The cost, stated plainly: a route that is added to app.routes.ts but not
# prerendered will 404 in production instead of falling back to the shell.
# Angular prerenders concrete routes automatically; a new PARAMETERISED route
# needs its slugs enumerated in app.routes.server.ts, as offices/:slug and
# permits/:slug are.
